<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>painel — Pão de Verdade · produção</title>
  <meta name="description" content="Painel de gestão de tempo da produção — linha do balanço 8h-18h.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topbar">
    <div class="marca">
      <img src="marca.png" alt="Pão de Verdade — Forneria Artesanal">
    </div>
    <div class="titulo-bloco">
      <h1 class="titulo">Linha do Dia</h1>
      <div class="subtitulo">Produção · 8h às 18h</div>
    </div>
    <div class="data" id="dataAtual">—</div>
    <button class="botao-controles" data-acao="menu" aria-expanded="false">menu</button>
    <div class="controles" id="controles" hidden>
      <div class="pessoas" id="contadorPessoas">1 pessoa</div>
      <nav class="acoes">
        <button class="acao" data-acao="adicionar">+ tarefa</button>
        <button class="acao" data-acao="pessoas">pessoas</button>
        <button class="acao" data-acao="dia">dia</button>
      </nav>
    </div>
  </header>

  <main class="timeline" id="timeline" aria-label="Linha do balanço do dia"></main>

  <div class="config" id="config" hidden>
    <div class="config-card">
      <div class="config-titulo" id="configTitulo">—</div>
      <div class="config-linha">
        <span class="config-rotulo">Duração</span>
        <button class="config-btn" data-acao="duracao-menos" aria-label="diminuir duração">−</button>
        <span class="config-valor" id="configDuracao">—</span>
        <button class="config-btn" data-acao="duracao-mais" aria-label="aumentar duração">+</button>
      </div>
      <button class="config-fechar" data-acao="fechar">fechar</button>
    </div>
  </div>

  <footer class="rodape" aria-live="polite" id="status">
    carregando…
  </footer>

  <script src="firebase-config.js"></script>
  <!-- Firebase SDK v8 (compatível com Firefox 68) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/resourceRegistry.js"></script>
  <script src="js/personCounter.js"></script>
  <script src="js/dayStore.js"></script>
  <script src="js/deviceSync.js"></script>
  <script src="js/timelineRenderer.js"></script>
  <script src="js/remoteNav.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
